# Render Blueprint for the SpaceLens API server (server/). The static app stays on GitHub Pages.
services:
  - type: web
    name: spacelens-api
    runtime: node
    plan: free
    region: frankfurt
    # Node built-ins only: nothing to install or build.
    buildCommand: node --version
    startCommand: node server/index.mjs
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secret: set in the dashboard when the Blueprint is created.
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://junction26.github.io
      # Render's proxy adds the caller's address to X-Forwarded-For.
      - key: CLIENT_IP_HEADER
        value: x-forwarded-for
      # Text-call limits per client address and per day. A themed room sends about 15 calls
      # within seconds, so these sit well above that. Values set in the dashboard override these.
      - key: RATE_LIMIT_BURST
        value: "90"
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: RATE_LIMIT_DAILY
        value: "20000"
      # Optional, defaults in server/README.md: MODEL_ALLOWLIST, MAX_BODY_BYTES, TRUSTED_PROXY_HOPS,
      # LOG_LEVEL, and the media limits MEDIA_RATE_BURST, MEDIA_RATE_PER_MINUTE, MEDIA_RATE_DAILY.
